name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: bizcord
          RABBITMQ_DEFAULT_PASS: bizcord
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test apps/user-profile-microservice/tests/UserProfile.UnitTests/UserProfile.UnitTests.csproj --configuration Release

      - name: Contract tests
        run: dotnet test apps/user-profile-microservice/tests/UserProfile.ContractTests/UserProfile.ContractTests.csproj --configuration Release

      - name: Integration tests
        run: dotnet test apps/user-profile-microservice/tests/UserProfile.IntegrationTests/UserProfile.IntegrationTests.csproj --configuration Release

      - name: Docker build
        run: docker build -f apps/user-profile-microservice/Dockerfile -t bizcord-user-profile .

      - name: Container startup smoke test
        run: |
          docker run -d --name user-profile-smoke --network host \
            -e 'RabbitMq__ConnectionString=host=localhost;username=bizcord;password=bizcord' \
            bizcord-user-profile
          trap 'docker rm -f user-profile-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8080/api/user-profiles > /dev/null; then
              echo "User Profile API is responding."
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' user-profile-smoke)" != "true" ]; then
              docker logs user-profile-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs user-profile-smoke
          exit 1
