services:
  vault:
    image: hashicorp/vault:1.21.0
    command: server -config=/vault/config/config.hcl
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    environment:
      VAULT_ADDR: http://127.0.0.1:8200

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["app"]
    environment:
      RABBITMQ_DEFAULT_USER: bizcord
      RABBITMQ_DEFAULT_PASS: bizcord
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user-profile:
    build:
      context: ../..
      dockerfile: apps/user-profile-microservice/Dockerfile
    profiles: ["app"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_started
    ports:
      - "127.0.0.1:5194:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Vault__Enabled: "true"
      Vault__Address: http://vault:8200
      Vault__SecretPath: secret/data/user-profile
      VAULT_TOKEN: ${VAULT_TOKEN:-}

volumes:
  vault-data:
